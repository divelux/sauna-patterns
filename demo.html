<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sauna Patterns — demo</title><link rel="stylesheet" href="patterns.css">
<style>body{margin:0;background:#f6f3ee;color:#1b1512;font:16px/1.5 Inter,system-ui,sans-serif}main{max-width:1120px;margin:0 auto;padding:40px 24px}
h1{font-size:36px;line-height:1.1;margin:0 0 8px}p{color:#6f655c;margin:0 0 24px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.sw{height:300px;border-radius:6px}figure{margin:0}figcaption{font-size:14px;color:#6f655c;margin-top:6px}code{font-size:13px}a{color:inherit}</style></head><body><main>
<h1>Sauna Patterns</h1><p>Seamless tiles as CSS backgrounds. Each swatch is one class.</p><div class="g">
<figure><div class="sw sauna-pattern sauna-pattern-steam" style="--sauna-tile:160px"></div><figcaption>Steam — <code>sauna-pattern-steam</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-stones" style="--sauna-tile:160px"></div><figcaption>Sauna stones — <code>sauna-pattern-stones</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-planks" style="--sauna-tile:160px"></div><figcaption>Wood planks — <code>sauna-pattern-planks</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-hats" style="--sauna-tile:160px"></div><figcaption>Sauna hats — <code>sauna-pattern-hats</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-leaves" style="--sauna-tile:160px"></div><figcaption>Birch leaves — <code>sauna-pattern-leaves</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-drops" style="--sauna-tile:160px"></div><figcaption>Water drops — <code>sauna-pattern-drops</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-snow" style="--sauna-tile:160px"></div><figcaption>Snowflakes — <code>sauna-pattern-snow</code></figcaption></figure>
<figure><div class="sw sauna-pattern sauna-pattern-kit" style="--sauna-tile:160px"></div><figcaption>Sauna kit — <code>sauna-pattern-kit</code></figcaption></figure>
</div><p style="margin-top:32px">Patterns by DIVELUX, makers of handmade wool sauna hats — <a href="https://diveluxsaunahat.com">diveluxsaunahat.com</a>. CC BY 4.0.</p></main></body></html>
